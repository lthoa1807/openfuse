# Runs the images that .github/workflows/release.yml publishes, so nothing is
# built from this checkout. Pulling needs a registry login while the packages
# are private:
#
#   echo "$(gh auth token)" | docker login ghcr.io -u <owner> --password-stdin
#
# Pick the version from the GitHub release, keep WORKER_TOKEN in .env (at least
# 32 random characters, the same value the API uses), then:
#
#   OPENFUSE_VERSION=0.1.0 docker compose --env-file .env -f infra/compose.ghcr.yaml up -d
#
# `latest` is the newest release; pin a version for anything long-lived.
#
# The API server is not published as an image. Deploy it from the repository
# (see render.yaml), set BROWSER_WORKER_URL=http://127.0.0.1:8790 and the same
# WORKER_TOKEN, and point COMPUTER_IMAGE at the computer image from the release:
#
#   docker pull ghcr.io/<owner>/openfuse-computer:0.1.0
#   COMPUTER_IMAGE=ghcr.io/<owner>/openfuse-computer:0.1.0
#
# OPENFUSE_IMAGE_OWNER defaults to the repository owner; override it when you
# mirror the images elsewhere.
name: openfuse
services:
  browser-worker:
    image: ghcr.io/${OPENFUSE_IMAGE_OWNER:-lthoa1807}/openfuse-browser-worker:${OPENFUSE_VERSION:-latest}
    pull_policy: always
    init: true
    restart: unless-stopped
    environment:
      WORKER_HOST: 0.0.0.0
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN to a random secret of at least 32 characters}
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - browser-profiles:/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 256mb
    mem_limit: 2g
    pids_limit: 256
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  browser-profiles:
